version: '3.8'

networks:
  rag_network:
    driver: bridge

volumes:
  chroma_db:
  logs:
  redis_data:
  ollama_data:
  grafana_data:
  prometheus_data:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-rag-chatbot:latest
    container_name: rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_FALLBACK_MODEL=True
      - FALLBACK_PROVIDER=groq
      - FALLBACK_MODEL=llama-3.3-70b-versatile
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_STREAMING=True
      - ENABLE_GUARDRAILS=True
      - ENABLE_MEMORY=True
      - PROMETHEUS_MULTIPROC_DIR=/tmp/metrics
    volumes:
      - chroma_db:/app/chroma_db
      - logs:/app/logs
      # Mount orders.db to the root or wherever backend expects it (it defaults to BASE_DIR which is /app)
      - ./orders.db:/app/orders.db:ro
    networks:
      - rag_network
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: rag_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rag_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana-oss:10.4.1
    container_name: rag_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - rag_network
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: rag_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rag_network
    depends_on:
      - api
